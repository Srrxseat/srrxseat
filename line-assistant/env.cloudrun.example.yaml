# Copy to env.cloudrun.yaml (gitignored), fill in the real values, and pass it
# to the deploy with --env-vars-file. Same values as your local .env.
#
#   cp env.cloudrun.example.yaml env.cloudrun.yaml
#
# Every value must be a quoted string - gcloud rejects unquoted values that
# look like numbers or booleans.
LINE_CHANNEL_ACCESS_TOKEN: "..."
LINE_CHANNEL_SECRET: "..."
ANTHROPIC_API_KEY: "..."
GOOGLE_OAUTH_CLIENT_ID: "..."
GOOGLE_OAUTH_CLIENT_SECRET: "..."
GOOGLE_OAUTH_REFRESH_TOKEN: "..."
GOOGLE_DRIVE_FOLDER_ID: "..."
GOOGLE_SHEET_ID: "..."

# Optional - defaults live in src/config.js
# GOOGLE_SHEET_TAB_NAME: "Documents"
# ANTHROPIC_MODEL: "claude-opus-5"
# ALLOWED_GROUP_IDS: "..."
