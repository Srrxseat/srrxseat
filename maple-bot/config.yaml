# ตั้งค่าบอท MapleStory Worlds - Old School Maple (Thief)

# ชื่อหน้าต่างเกม หรือชื่อแอป (ใช้หาตำแหน่งหน้าต่าง) - เช็คชื่อจริงจาก title bar
# macOS: ถ้าเล่นผ่าน Parallels/CrossOver ให้ใส่ชื่อแอปนั้นแทน เช่น "Parallels Desktop"
window_title: "MapleStory Worlds"

# ปุ่มควบคุม (บอทเริ่ม/หยุด/ออก) - ใช้ชื่อปุ่มของ pynput เช่น f8, f9, f10
# macOS: ตั้ง "Use F1, F2, etc. keys as standard function keys" หรือกด fn ค้างไว้
hotkeys:
  toggle: f9      # เริ่ม/หยุดบอท
  quit: f10       # ปิดโปรแกรม
  record: f8      # บันทึกตำแหน่งตัวละครตอนนี้เป็นจุดใหม่ใน routine
  clear: f7       # ลบจุดทั้งหมดใน routine (เริ่มบันทึกใหม่)
  macro: f6       # เริ่ม/หยุดอัดปุ่มที่คุณเล่น (ใช้กับ mode: replay)

# ปุ่มในเกม (ตั้งให้ตรงกับ key config ในเกม)
# ชื่อพิเศษ: alt (= Option บน Mac), ctrl, shift, delete, end, home, page_up, space ...
# ตัวอักษร/ตัวเลขใส่ตรงๆ เช่น z, "0"
# ถ้าได้ Lucky Seven แล้ว ลากสกิลไปใส่ quickslot แล้วเปลี่ยน attack เป็นปุ่มนั้น
# ยา: ลากยาแดง/ฟ้าไปใส่ช่อง Del / End ใน quickslot
keys:
  jump: space         # Space bar
  attack: z
  loot: x
  hp_potion: delete
  mp_potion: end

# บัฟที่กดซ้ำตามเวลา (วินาที)
buffs:
  - name: haste       # ได้ตอน 2nd job (Assassin/Bandit) - ใส่ interval: 190 เมื่อได้แล้ว
    key: shift
    interval: 0
  - name: dark_sight
    key: "0"
    interval: 0       # 0 = ไม่ใช้

# พื้นที่บนหน้าจอ (พิกัด pixel ในภาพที่จับได้ เทียบกับมุมซ้ายบนของหน้าต่างเกม: [x, y, w, h])
# จอ Retina ภาพจะเป็น 2 เท่าของขนาดหน้าต่าง - ให้ calibrate.py ตั้งค่าให้ จะถูกเสมอ
# ใช้ tools/calibrate.py ลากเลือกแล้วระบบจะบันทึกให้อัตโนมัติ
regions:
  minimap: [10, 30, 200, 120]
  hp_bar: [0, 0, 0, 0]
  mp_bar: [0, 0, 0, 0]

# สีจุดตัวละครบนมินิแมพ (HSV, OpenCV: H 0-179) - ค่าเริ่มต้นคือสีเหลือง
# calibrate.py จะให้คลิกที่จุดตัวละคร/หลอด แล้วตั้งค่าสีให้อัตโนมัติ
player_dot_hsv:
  lower: [20, 120, 180]
  upper: [35, 255, 255]

# สีหลอด HP/MP (HSV) ใช้คำนวณ % ที่เหลือ
hp_bar_hsv:              # สีแดงอยู่ทั้ง H≈0 และ H≈179 จึงใช้ช่วงวนรอบ (lower > upper)
  lower: [170, 120, 120]
  upper: [10, 255, 255]
mp_bar_hsv:
  lower: [100, 120, 120]
  upper: [125, 255, 255]

# ใช้ยาเมื่อเหลือต่ำกว่า (0.0 - 1.0)
hp_threshold: 0.5
mp_threshold: 0.3

# การเคลื่อนที่ (หน่วยเป็นสัดส่วนของมินิแมพ 0.0 - 1.0)
movement:
  tolerance_x: 0.02     # ใกล้เป้าหมายแค่ไหนถือว่าถึง
  tolerance_y: 0.04
  timeout: 8.0          # วินาที ถ้าเดินไม่ถึงให้ข้ามจุดนี้
  flash_jump: false     # true เมื่อได้ Flash Jump แล้ว (Assassin/Hermit/Night Lord)

# โหมดฟาร์ม
#   patrol = กด F8 ทีละจุด 6-10 จุดทั่วแมพ บอทเดินวนจุดไปเรื่อยๆ เจอมอนระหว่างทางก็เข้าไปตี
#            โดนชนตกก็ไปจุดที่ใกล้ที่สุดต่อ (แนะนำ)
#   area   = ยืนกลางพื้นที่แล้วกด F8 บอทจะอยู่ในวงกลมนี้ หามอนแล้วตี
#   route  = เดินตามจุดที่บันทึกด้วย F8 แล้วตีตามจำนวนครั้งที่ตั้งไว้ (ไม่หามอน)
#   replay = กด F6 อัดปุ่มที่คุณเล่นเอง แล้วบอทกดซ้ำแบบเดิมวนไปเรื่อยๆ
mode: patrol

replay:
  reach: 0.05             # ก่อนเริ่มแต่ละรอบ เดินกลับจุดเริ่มให้ห่างไม่เกินเท่านี้ (สัดส่วนมินิแมพ)
  return_timeout: 20      # กลับจุดเริ่มไม่ถึงภายในกี่วินาที = เล่นต่อจากตรงนั้นเลย

patrol:
  arrive_reach: 0.035     # ถือว่าถึงจุดเมื่ออยู่ห่างไม่เกินเท่านี้ (สัดส่วนมินิแมพ)
  level_tolerance: 0.015  # สูง/ต่ำต่างกันไม่เกินเท่านี้ = ชั้นเดียวกัน (แมพสูงๆ ชั้นห่างกันแค่ ~0.04)
  auto_spacing: 0.06      # ตอนตั้งจุด เดินไกลกว่านี้ระหว่าง F8 = เพิ่มจุดย่อยให้อัตโนมัติ (ตรงที่ยืนนิ่ง)
  chase_range: 0.30       # มอนบนพื้นเดียวกันห่างไม่เกินเท่านี้ (สัดส่วนความกว้างจอ) = เข้าไปตี
  fallen_chase_range: 0.5 # โดนชนตกลงต่ำกว่าเส้นทาง = ตีมอนทุกตัวบนชั้นนั้นให้หมดก่อนค่อยกลับ
  point_timeout: 15       # ไปจุดไหนไม่ถึงภายในกี่วินาที (เช่นโดนชนตก) = ไปจุดที่ใกล้ที่สุดแทน

# การหามอนและการตี (ใช้ทั้งโหมด patrol และ area)
area:
  radius: 0.15            # (โหมด area) รัศมีวงกลม (สัดส่วนของมินิแมพ)
  attack_range: 0.07      # ระยะตี (สัดส่วนความกว้างจอ): โจรมีด ~0.07 (ประชิด), โจรปาดาว ~0.30
  vertical_range: 0.04    # มอนต้องอยู่พื้นเดียวกับตัวละคร (สูง/ต่ำต่างกันไม่เกินเท่านี้ของความสูงจอ)
  chase_levels: true      # มอนอยู่ชั้นอื่น = กระโดดขึ้น/ลงไปหา (false = ยืนชั้นเดิมเสมอ)
  attacks_per_tick: 3     # ตีกี่ครั้งก่อนมองหามอนใหม่
  give_up_rounds: 4       # ตีเป้าเดิมที่ไม่ขยับ/ไม่ตายกี่รอบ = ถือว่าเป็นของดรอป เดินไปเก็บแล้วข้าม
  loot_every: 6           # กดเก็บของทุกกี่วินาที
  monster_threshold: 0.55 # ความเหมือนของภาพมอน (ต่ำ = เจอง่ายแต่ผิดบ่อย, สูง = แม่นแต่พลาดบ่อย)
  player_threshold: 0.6

# บันทึกภาพสิ่งที่บอทเห็น/ตัดสินใจทุก 1 วินาทีไว้ในโฟลเดอร์ debug/ (เก็บ 120 ภาพล่าสุด)
# ใช้ส่งให้ช่วยตรวจปัญหา - ปิดได้ด้วย false
debug_snapshots: true

# ไฟล์จุด (โหมด patrol / route) - กด F8 ในเกมเพื่อเพิ่มจุด, F7 ลบทั้งหมด (ไฟล์จะถูกสร้างให้เอง)
routine: routines/my_route.yaml
